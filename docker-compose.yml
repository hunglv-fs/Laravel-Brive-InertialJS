version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app
    working_dir: /var/www
    volumes:
      - ./:/var/www
    ports:
      - "9000:9000"   # expose PHP-FPM để Nginx truy cập
    networks:
      - app-network

  web:
    image: nginx:alpine
    container_name: web
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
    ports:
      - "8080:80"     # host:8080 → container:80 (HTTP)
    depends_on:
      - app
    networks:
      - app-network

  db:
    image: mysql:5.7
    container_name: db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: brive
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
    volumes:
      - dbdata:/var/lib/mysql
    ports:
      - "3306:3306"   # tránh đụng MySQL local
    networks:
      - app-network

  phpmyadmin:
      image: phpmyadmin/phpmyadmin
      container_name: phpmyadmin
      environment:
        PMA_HOST: db
        PMA_PORT: 3306
        PMA_USER: root
        PMA_PASSWORD: root
      ports:
        - "8081:80"   # host:8081 → phpMyAdmin UI
      depends_on:
        - db
      networks:
        - app-network
networks:
  app-network:
    driver: bridge

volumes:
  dbdata:
